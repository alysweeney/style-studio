<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Style Studio</title>
<meta name="theme-color" content="#2F3F87">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ---------------- signed out ---------------- -->
<section id="view-auth" class="view">
  <div class="col narrow">
    <header class="masthead">
      <h1 class="wordmark">Style Studio</h1>
    </header>
    <p class="lede">Outfits from the clothes you already own, for the weather you're
      actually getting.</p>

    <form id="auth-form" class="stack">
      <label class="field-in">
        <span class="label">Email</span>
        <input type="email" id="auth-email" autocomplete="email" required>
      </label>
      <label class="field-in">
        <span class="label">Password</span>
        <input type="password" id="auth-password" autocomplete="current-password"
               minlength="6" required>
      </label>
      <p id="auth-error" class="error" hidden></p>
      <div class="row">
        <button type="submit" class="primary" id="auth-signin">Sign in</button>
        <button type="button" id="auth-register">Create account</button>
      </div>
    </form>

    <p id="auth-unconfigured" class="note" hidden>
      Firebase isn't configured yet — paste your web config into <code>cloud.js</code>.
    </p>
  </div>
</section>

<!-- ---------------- today ---------------- -->
<section id="view-today" class="view" hidden>
  <div class="col">
    <header class="masthead">
      <h1 class="wordmark">Style Studio</h1>
      <span class="today" id="today-date"></span>
    </header>

    <section id="weather" class="weather" aria-live="polite">
      <p class="note">Checking the forecast…</p>
    </section>

    <div class="row spread">
      <span class="label">Dressing for</span>
      <div class="seg-ctl" id="formality-picker" role="radiogroup" aria-label="How dressed up"></div>
    </div>

    <div id="outfits" class="stack"></div>
    <div id="gap"></div>
  </div>
</section>

<!-- ---------------- closet ---------------- -->
<section id="view-closet" class="view" hidden>
  <div class="col">
    <header class="masthead">
      <h1 class="wordmark">Closet</h1>
      <span class="today" id="closet-count"></span>
    </header>
    <div class="row">
      <button id="closet-import">Import a seed file</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <p id="closet-todo" class="note" hidden></p>
    <div id="closet-grid" class="grid"></div>
  </div>
</section>

<!-- ---------------- add an item ---------------- -->
<section id="view-add" class="view" hidden>
  <div class="col">
    <header class="masthead">
      <h1 class="wordmark">Add an item</h1>
    </header>

    <!-- Deliberately a <div>, not a <label> wrapping the input. An input nested
         inside its own label double-fires the click in Chrome, which opened the
         file picker twice — the second open superseded the first and the chosen
         photos were silently discarded. One explicit handler, one click. -->
    <div class="drop" id="drop" role="button" tabindex="0"
         aria-label="Add photos of your clothes">
      <img id="add-preview" alt="" hidden>
      <span class="drop-empty" id="drop-empty">
        <span class="drop-plus">+</span>
        <span>Add photos — pick as many as you like</span>
        <span class="drop-sub">JPEG, PNG or HEIC</span>
      </span>
    </div>
    <input type="file" id="add-file" accept="image/*,.heic,.heif" multiple hidden>
    <p id="add-photo-note" class="hint" hidden></p>

    <div class="human" id="add-bulk" hidden></div>
    <div id="add-queue" class="stack"></div>
    <p id="add-error" class="error" hidden></p>
    <div class="row" id="add-actions" hidden>
      <button class="primary" id="add-save">Save to closet</button>
      <button id="add-clear">Clear</button>
      <span class="hint" id="add-summary"></span>
    </div>
  </div>
</section>

<!-- ---------------- nav ---------------- -->
<nav id="nav" hidden>
  <button data-view="today" class="on">Today</button>
  <button data-view="closet">Closet</button>
  <button data-view="add">Add</button>
  <button id="nav-signout" title="Sign out">Out</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
